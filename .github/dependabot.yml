# Version updates run monthly; security updates open as soon as an advisory applies.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/New_York
    # Skip releases newer than this; security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 2
    assignees: [ChrisBuilds]
    labels: [maintenance, ci, no-changelog]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/New_York
    # Skip releases newer than this; security updates are not delayed.
    cooldown:
      default-days: 7  # GitHub Actions does not support per-SemVer cooldowns.
    open-pull-requests-limit: 2
    assignees: [ChrisBuilds]
    labels: [maintenance, ci, no-changelog]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

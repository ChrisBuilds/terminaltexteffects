# Version updates run monthly; security updates open as soon as an advisory applies.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/New_York
    # Skip releases newer than this; security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 2
    assignees: [ChrisBuilds]
    labels: [maintenance, ci, no-changelog]
    commit-message:
      prefix: "chore(deps)"
    # Dependabot cannot update the Python-version splits for pytest (8.x for 3.9, 9.x for 3.10+)
    # or pytest-randomly (4.0.x for 3.9, 5.x for 3.10+), so version and security updates for them
    # fail. Upgrade them with `uv lock --upgrade-package <name>` and watch their advisories
    # manually; remove this when 3.9 is dropped (#184).
    ignore:
      - dependency-name: pytest
      - dependency-name: pytest-randomly
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/New_York
    # Skip releases newer than this; security updates are not delayed.
    cooldown:
      default-days: 7  # GitHub Actions does not support per-SemVer cooldowns.
    open-pull-requests-limit: 2
    assignees: [ChrisBuilds]
    labels: [maintenance, ci, no-changelog]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

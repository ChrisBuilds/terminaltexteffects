name: Release

# Pushing a `release-X.Y.Z` tag builds and validates the distributions, then waits for maintainer
# approval in the `pypi` environment before publishing to PyPI and creating the GitHub release.
# Manually running the workflow from `main` publishes a `.devN` build to TestPyPI as a dry run.
# Publishing uses PyPI Trusted Publishing (OIDC); no API token is stored anywhere.

on:
  push:
    tags: ["release-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Release builds never restore caches written by other workflow runs.
          enable-cache: false
      - name: Check the release source and version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$EVENT_NAME" == 'push' ]]; then
            if [[ "$REF_NAME" != "release-$version" ]]; then
              echo "::error::Tag $REF_NAME does not match pyproject.toml version $version."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Tag $REF_NAME does not point to a commit on main."
              exit 1
            fi
            # Fail before publishing if the GitHub release would have no notes.
            python tools/changelog.py --release-notes "$version" > /dev/null
          else
            if [[ "$REF_NAME" != 'main' ]]; then
              echo '::error::Run TestPyPI dry runs from main.'
              exit 1
            fi
            # TestPyPI rejects reused versions, so each dry run gets a unique dev version.
            version="$version.dev$RUN_NUMBER"
            sed -i "s/^version = \".*\"/version = \"$version\"/" pyproject.toml
            uv lock  # Updates only the project's own version in uv.lock.
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install locked development tools
        run: uv sync --locked --group dev
      - name: Build and validate distributions
        run: |
          .venv/bin/python tools/check_artifacts.py --output-dir "$RUNNER_TEMP/artifacts"
          # Publish only the direct wheel and sdist, not the verification wheel rebuilt from the sdist.
          mkdir dist
          cp "$RUNNER_TEMP"/artifacts/*.whl "$RUNNER_TEMP"/artifacts/*.tar.gz dist/
          {
            echo '## Distributions'
            echo '```'
            (cd dist && sha256sum ./*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/terminaltexteffects/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/terminaltexteffects/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # The first attempt fails loudly on duplicates; a rerun may finish a partial upload.
          skip-existing: ${{ github.run_attempt != 1 }}
      - name: Verify PyPI files match this run's artifacts
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.request

          url = f"https://pypi.org/pypi/terminaltexteffects/{os.environ['VERSION']}/json"
          local = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in pathlib.Path("dist").iterdir()}
          remote = {}
          for _ in range(10):  # PyPI's JSON API can lag a newly uploaded release.
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      remote = {item["filename"]: item["digests"]["sha256"] for item in json.load(response)["urls"]}
              except OSError as error:
                  print(f"Waiting for PyPI: {error}")
              if local.keys() <= remote.keys():
                  break
              time.sleep(15)
          missing = sorted(local.keys() - remote.keys())
          unexpected = sorted(remote.keys() - local.keys())
          mismatched = sorted(name for name in local.keys() & remote.keys() if local[name] != remote[name])
          if missing or unexpected or mismatched:
              raise SystemExit(
                  "PyPI files differ from this run's artifacts. "
                  f"Missing: {missing}; unexpected: {unexpected}; mismatched: {mismatched}"
              )
          print("PyPI files match this run's artifacts:", ", ".join(sorted(local)))
          PY

  github-release:
    name: Create GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the release from the dated changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 tools/changelog.py --release-notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

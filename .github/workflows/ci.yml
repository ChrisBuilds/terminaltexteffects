name: CI

# Branch protection requires only the final `CI passed` job, which fails if any other job
# failed or was cancelled. Add or remove jobs here without changing repository settings.

on:
  push:
    branches: [main]
  pull_request:
    # Label events rerun CI so the `no-changelog` label is re-evaluated.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  DIAGNOSTICS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  DIAGNOSTICS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      nix: ${{ steps.nix.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: quality
      - name: Review newly introduced dependency vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          vulnerability-check: true
          warn-only: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
      - name: Install package and locked development tools
        run: uv sync --locked --group dev
      - name: Record test reproduction context
        run: .venv/bin/python tools/write_test_context.py
      - name: Run pre-commit checks on all files
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
      - name: Check changelog fragments
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SKIP_DECISION: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          args=()
          if [[ "$SKIP_DECISION" != 'true' ]]; then
            args+=(--base "$PR_BASE")
          fi
          .venv/bin/python tools/changelog.py "${args[@]}"
      - name: Check shipped effect inventory
        run: |
          .venv/bin/python tools/check_effect_inventory.py
          .venv/bin/python -m pytest -q tests/test_effect_inventory.py \
            --junitxml=test-results/effect-inventory.xml -o junit_logging=no -o faulthandler_timeout=120
      - name: Execute selected documentation examples
        env:
          TTE_REQUIRE_DOC_EXAMPLES: "1"
        run: |
          .venv/bin/python -m pytest -q tests/test_documented_examples.py \
            --junitxml=test-results/documented-examples.xml -o junit_logging=no -o faulthandler_timeout=120
      - name: Build documentation and check links
        run: .venv/bin/python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/docs"
      - name: Validate release artifacts
        run: .venv/bin/python tools/check_artifacts.py
      - name: Detect Nix packaging changes
        id: nix
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$PR_BASE" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$PR_BASE" HEAD |
            grep -qE '^(flake\.nix|flake\.lock|default\.nix|pyproject\.toml|tools/check_nix\.sh|\.github/workflows/ci\.yml)$'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload test diagnostics
        if: "!cancelled() && hashFiles('test-results/context.json') != ''"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-quality
          path: |
            test-results/context.json
            test-results/*.xml
          retention-days: 7
          if-no-files-found: error

  nix:
    name: Nix / ${{ matrix.name }}
    # PRs run Nix only when packaging inputs change; main pushes and manual runs always do.
    needs: quality
    if: needs.quality.outputs.nix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-15
            name: macOS
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate locked Nix packaging and installed commands
        run: bash tools/check_nix.sh 2>&1 | tee "$RUNNER_TEMP/nix-validation.log"
      - name: Upload Nix diagnostics
        if: "!cancelled()"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-validation-${{ matrix.name }}
          path: ${{ runner.temp }}/nix-validation.log
          retention-days: 7
          if-no-files-found: error

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The coverage diff report needs the PR merge commit and its base parent.
          fetch-depth: ${{ matrix.python-version == '3.14' && '2' || '1' }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-${{ matrix.python-version }}
      - name: Install test shells
        run: |
          # Zsh needs only Ubuntu packages; unrelated third-party repositories can fail independently.
          apt_options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes zsh
      - name: Install package and locked test dependencies
        run: uv sync --locked --no-default-groups --group test --no-editable
      - name: Record test reproduction context
        run: .venv/bin/python tools/write_test_context.py
      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "import terminaltexteffects"
          "$GITHUB_WORKSPACE/.venv/bin/tte" --help
      - name: Run default test suite
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          coverage_args=()
          if [[ "$PYTHON_VERSION" == '3.14' ]]; then
            coverage_args+=(--cov=terminaltexteffects --cov-branch --cov-config=pyproject.toml
              --cov-report=term-missing --cov-report=xml:coverage/coverage.xml --cov-report=html:coverage/html)
          fi
          .venv/bin/python -m pytest -n auto --durations=20 --junitxml=test-results/default-suite.xml \
            -o junit_logging=no -o faulthandler_timeout=120 "${coverage_args[@]}"
      - name: Summarize coverage
        # Informational only: coverage never fails CI.
        if: "!cancelled() && hashFiles('coverage/coverage.xml') != ''"
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Coverage: $(.venv/bin/coverage report --format=total)% of lines and branches"
            # A PR checkout is GitHub's merge commit; its first parent is the base it was merged onto.
            if [[ "$EVENT_NAME" == 'pull_request' ]]; then
              if .venv/bin/diff-cover coverage/coverage.xml --compare-branch=HEAD^1 \
                --format "markdown:$RUNNER_TEMP/diff-cover.md" > /dev/null; then
                # Keep the per-file list and summary; drop the long source listings that follow.
                awk '/^## Summary/ { summary = 1 } summary && /^## / && !/^## Summary/ { exit } { print }' \
                  "$RUNNER_TEMP/diff-cover.md"
              else
                echo '_Changed-line coverage report unavailable; see the log._'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: "!cancelled() && hashFiles('coverage/coverage.xml') != ''"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-3.14
          path: coverage/
          retention-days: 14
          if-no-files-found: error
      - name: Upload test diagnostics
        if: "!cancelled() && hashFiles('test-results/context.json') != ''"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            test-results/context.json
            test-results/*.xml
          retention-days: 7
          if-no-files-found: error

  completions:
    name: Shell completions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: completions
      - name: Install package and locked test dependencies
        run: uv sync --locked --no-default-groups --group test --no-editable
      - name: Check generated shell completions
        run: .venv/bin/python tools/generate_shell_completions.py --check

  platforms:
    name: ${{ matrix.name }} / Python 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: macOS
            os: macos-15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      TTE_REQUIRE_PWSH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: platform-${{ matrix.os }}
      - name: Install package and locked test dependencies
        run: uv sync --locked --no-default-groups --group test --no-editable
      - name: Record test reproduction context
        run: uv run --no-sync python tools/write_test_context.py
      - name: Check installed CLI and piped input outside the checkout
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          outside = Path(os.environ["RUNNER_TEMP"]) / "tte-platform-smoke"
          outside.mkdir(exist_ok=True)
          env = {key: value for key, value in os.environ.items()
                 if key not in {"PYTHONPATH", "PYTHONHOME", "TTE_DEV_EFFECTS_DIR"}}
          env["XDG_CONFIG_HOME"] = str(outside / "empty-config")
          probe = (
              "import pathlib, sys, terminaltexteffects; "
              "assert pathlib.Path(terminaltexteffects.__file__).resolve().is_relative_to("
              "pathlib.Path(sys.prefix).resolve()); "
              "from terminaltexteffects.__main__ import build_parser; "
              "assert 'wipe' in build_parser()[1]"
          )
          subprocess.run([sys.executable, "-I", "-c", probe], cwd=outside, env=env, check=True)
          for entry in ("tte", "terminaltexteffects"):
              executable = Path(sys.executable).parent / (entry + (".exe" if os.name == "nt" else ""))
              result = subprocess.run([str(executable), "--help"], cwd=outside, env=env,
                                      capture_output=True, text=True, encoding="utf-8", check=True)
              assert "wipe" in result.stdout, result.stdout
              result = subprocess.run(
                  [str(executable), "--seed", "102", "--frame-rate", "0", "--no-color",
                   "--canvas-width", "2", "--canvas-height", "1", "--ignore-terminal-dimensions",
                   "wipe", "--final-gradient-stops", "ffffff", "--final-gradient-steps", "1",
                   "--final-gradient-frames", "1"],
                  cwd=outside, env=env, input="OK", capture_output=True, text=True,
                  encoding="utf-8", check=True,
              )
              assert "OK" in result.stdout, result.stdout
              assert "\x1b[?25l" in result.stdout and "\x1b[?25h" in result.stdout, result.stdout
              print(f"{entry}: installed CLI help, piped input, rendering, and cursor restoration passed")
          PY
      - name: Run focused terminal and CLI regressions
        run: |
          uv run --no-sync python -m pytest -q --durations=10 \
            --junitxml=test-results/platform.xml -o junit_logging=no -o faulthandler_timeout=120 \
            tests/engine_tests/test_terminal.py \
            tests/engine_tests/test_terminal_input.py \
            tests/engine_tests/test_terminal_unicode.py \
            tests/engine_tests/test_terminal_ansi_sequences.py \
            tests/engine_tests/test_base_config.py \
            tests/test_powershell_completion.py \
            tests/test_cli.py::test_build_parser_registers_effects \
            tests/test_cli.py::test_runtime_parser_includes_plugin_effect \
            tests/test_cli.py::test_main_unsupported_ansi_sequence_exits_with_error \
            tests/test_cli.py::test_main_empty_input_is_silent_success \
            tests/test_cli.py::test_main_empty_renderable_input_exits_with_error \
            tests/test_cli.py::test_development_effects_require_explicit_opt_in

      - name: Upload test diagnostics
        if: "!cancelled() && hashFiles('test-results/context.json') != ''"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.name }}-python-3.14
          path: |
            test-results/context.json
            test-results/*.xml
          retention-days: 7
          if-no-files-found: error

  ci-passed:
    name: CI passed
    # Runs even when dependencies fail; a skipped required check would count as passing.
    if: always()
    needs: [quality, nix, tests, completions, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be intentionally skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [[ " $RESULTS " == *' failure '* || " $RESULTS " == *' cancelled '* ]]; then
            exit 1
          fi

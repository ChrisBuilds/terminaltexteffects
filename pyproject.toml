[project]
name = "terminaltexteffects"
version = "0.15.0"
description = "TerminalTextEffects (TTE) is a terminal visual effects engine."
authors = [{ name = "Chris", email = "741258@pm.me" }]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"

[project.urls]
Repository = "https://github.com/ChrisBuilds/terminaltexteffects"
Documentation = "https://chrisbuilds.github.io/terminaltexteffects/"

[project.scripts]
tte = "terminaltexteffects.__main__:main"
terminaltexteffects = "terminaltexteffects.__main__:main"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocstrings-python>=1.11.1",
    "pymdown-extensions>=10.15",
]

[tool.ruff]
show-fixes = true
unsafe-fixes = false
line-length = 120
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "COM812", # formatting owns trailing commas
    "D203",   # use D211: no blank line before class docstrings
    "D213",   # use D212: summary on the first line
    "C90",
    "CPY001",
    "ANN401",
    "EXE",
    "PLR0912", # too many branches
    "PLR0913", # too many function args
    "PLR2004", # magic numbers
    "RUF009",  # function-call-in-dataclass-default-argument
    "S101",    # use of assert
    "S311",    # suspicious-non-cryptographic-random-usage
    "SLF001",  # private member access
    "TRY003",  # f-strings in exception message
    "T201",    # printing
]
select = ["ALL"]
fixable = ["ALL"]
extend-fixable = ["EM102"]
typing-extensions = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"**/tests/*" = [
    "S101", # assert

]

[tool.pytest.ini_options]
console_output_style = "progress"
minversion = "6.0"
addopts = ["--capture=sys", "--strict-markers", "--strict-config", "-ra", "-m", "not manual and not visual"]
markers = [
    "manual: subset to run manually",
    "visual: visually inspect effects",
    "effects: quick effect tests",
    "engine: engine tests",
    "animation: animation tests",
    "motion: motion tests",
    "terminal: terminal tests",
    "base_character: base character tests",
    "utils: utility tests",
    "smoke: quick tests covering over 90% of code",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["terminaltexteffects"]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true

[tool.pyright]
pythonVersion = "3.9"

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "changelog.d/template.md.jinja"
start_string = "<!-- towncrier release notes start -->\n"
title_format = false
issue_format = "[#{issue}](https://github.com/ChrisBuilds/terminaltexteffects/issues/{issue})"
wrap = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "skip"
name = "Skip reasons"
showcontent = true

[tool.hatch.build.targets.sdist]
exclude = ["docs/**", "tests/**", "/dev_effects/**", "/terminaltexteffects/effects/effect_dev.py"]

[tool.hatch.build.targets.wheel]
packages = ["terminaltexteffects"]
exclude = ["/dev_effects/**", "/terminaltexteffects/effects/effect_dev.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
quality = [
    "ruff==0.16.10",
    "pyright==1.1.414",
]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
    "shtab==1.12.1",
    "towncrier==25.8.0",
]
dev = [
    { include-group = "artifacts" },
    { include-group = "test" },
    { include-group = "quality" },
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocstrings-python>=1.11.1",
    "pre-commit>=3.8",
    "pymdown-extensions>=10.15",
]
artifacts = [
    "hatchling>=1.27",
    "tomli>=2",
    "twine>=6",
]

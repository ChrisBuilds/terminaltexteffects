# All hooks run tools from the locked project environment (`uv sync --locked --group dev`).
# CI runs `pre-commit run --all-files`, so passing locally means these checks pass in CI.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: Trailing whitespace
        entry: uv run --no-sync --offline trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]
        exclude: ^tests/testinput/
      - id: merge-conflict
        name: Merge conflict markers
        entry: uv run --no-sync --offline check-merge-conflict --assume-in-merge
        language: system
        types: [text]
      - id: ruff-check
        name: Ruff lint
        entry: uv run --no-sync --offline ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync --offline ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: Pyright
        entry: uv run --no-sync --offline pyright
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: actionlint
        name: GitHub Actions workflows
        entry: uv run --no-sync --offline actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: shellcheck
        name: ShellCheck
        entry: uv run --no-sync --offline shellcheck
        language: system
        types: [shell]
        exclude: completions/  # generated by shtab
      - id: changelog
        name: Changelog fragments
        entry: uv run --no-sync --offline python tools/changelog.py
        language: system
        files: ^(changelog\.d/|tools/changelog\.py$|pyproject\.toml$)
        pass_filenames: false

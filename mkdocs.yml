site_name: TerminalTextEffects Docs
site_url: https://chrisbuilds.github.io/terminaltexteffects/
site_description: TerminalTextEffects Documentation
site_author: ChrisBuilds
repo_url: https://github.com/ChrisBuilds/terminaltexteffects
docs_dir: docs
# Effect Guide example modules are included in pages with snippets, not published as files.
exclude_docs: |
  effectguide/examples/


theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
  features:
    - content.code.copy
    - content.code.annotate

extra:
  docs_revision: !ENV [DOCS_REVISION, ""]

plugins:
  - mkdocstrings

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.tilde
  - attr_list
  - def_list

hooks:
  - tools/mkdocs_changelog.py

nav:
  - Intro to TTE: index.md
  - Changelog: changelog.md
  - Support and Compatibility: support.md
  - Security Policy: security.md
